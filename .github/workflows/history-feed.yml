# Publishes the What's New history feed (changes.json.gz) to the gh-pages branch every few hours.
# The app fetches it from https://omeg4-dev.github.io/fmhy-android/history/changes.json.gz.
# One-time setup: Settings > Pages > Deploy from branch `gh-pages` (root).
name: history-feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs (verified against the release tags); bump on purpose.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fmhy/edit
          path: edit
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # history.sqlite keeps stable ids and makes every run incremental; a cache miss only means a full walk.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state
          key: history-state-${{ github.run_id }}
          restore-keys: history-state-

      # The previous feed is the baseline for the "feed collapsed" guard.
      - name: Fetch previous feed
        run: |
          mkdir -p out
          curl -fsS -m 30 -o out/changes-meta.json \
            "https://omeg4-dev.github.io/fmhy-android/history/changes-meta.json" || rm -f out/changes-meta.json

      - name: Build feed
        run: uv run --project pipeline fmhy-build feed --repo edit --rev HEAD --state state --out out

      # The feed is checked against the git history it was built from; a feed whose rows the diffs do not
      # back is never published (the previous one stays live).
      - name: Verify feed against git history
        run: uv run --project pipeline fmhy-build verify-feed --repo edit --feed out/changes.json.gz

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || git branch gh-pages $(git commit-tree -m init $(git hash-object -w -t tree /dev/null))
          git worktree add pages gh-pages
          mkdir -p pages/history
          cp out/changes.json.gz out/changes-meta.json pages/history/
          cd pages
          git add history
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="history-feed" -c user.email="history-feed@users.noreply.github.com" \
            commit -m "history feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
