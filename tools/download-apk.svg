<svg xmlns="http://www.w3.org/2000/svg" width="240" height="46" viewBox="0 0 240 46">
  <defs>
    <!-- Inner subtle background gradient matching the "Featured on FMHY" badge -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192734" />
      <stop offset="50%" stop-color="#231D38" />
      <stop offset="100%" stop-color="#351B39" />
    </linearGradient>

    <!-- Border gradient (Teal to Purple to Pink) -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C6E7D" />
      <stop offset="50%" stop-color="#6A558E" />
      <stop offset="100%" stop-color="#A84A9E" />
    </linearGradient>

    <!-- Text "APK" gradient matching the "FMHY" text on the left badge -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CE8FF" />
      <stop offset="100%" stop-color="#F582EE" />
    </linearGradient>

    <!-- Icon glow -->
    <filter id="icon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
    </filter>
  </defs>

  <!-- Button Body (Exact 44px height centered in 46px viewBox, rx=8 to match left badge) -->
  <rect x="1.25" y="1.25" width="237.5" height="43.5" rx="8" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Glowing Download Arrow Icon on the Left -->
  <g transform="translate(20, 11)">
    <!-- Teal/Pink Glow behind icon -->
    <path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#icon-glow)" opacity="0.8"/>
    <path d="M13 2v12m0 0l-5-5m5 5l5-5M6 19h14" stroke="#E055DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#icon-glow)" opacity="0.8"/>
    <!-- Crisp White Download Icon -->
    <path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Typography matching "Featured on FMHY" ("Download" in white, "APK" in FMHY gradient bold) -->
  <text x="54" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" fill="#E6E6EA" font-weight="500">
    Download <tspan font-weight="800" fill="url(#text-grad)">APK</tspan>
  </text>
</svg>
