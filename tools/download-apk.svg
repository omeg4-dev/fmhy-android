<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64">
  <defs>
    <!-- Exact 3-color gradient sampled from the FMHY logo -->
    <linearGradient id="fmhy-aura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#257D92" />
      <stop offset="50%" stop-color="#5E5496" />
      <stop offset="100%" stop-color="#E055DB" />
    </linearGradient>

    <linearGradient id="fmhy-border" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2B879E" />
      <stop offset="50%" stop-color="#685BA3" />
      <stop offset="100%" stop-color="#E055DB" />
    </linearGradient>

    <!-- Soft diffused neon glow filter -->
    <filter id="neon-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>
    
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
    </filter>
  </defs>

  <!-- Outer Diffused Neon Aura -->
  <rect x="14" y="12" width="232" height="42" rx="12" fill="url(#fmhy-aura)" opacity="0.75" filter="url(#neon-glow)" />

  <!-- Dark Button Body -->
  <rect x="12" y="10" width="236" height="44" rx="12" fill="#131316" stroke="url(#fmhy-border)" stroke-width="1.8" />

  <!-- Miniaturized FMHY Play Logo with directional Teals/Magentas -->
  <g transform="translate(30, 20)">
    <!-- Teal left shadow -->
    <polygon points="0,3 0,23 18,13" fill="#257D92" filter="url(#logo-glow)" />
    <!-- Magenta top-right shadow -->
    <polygon points="4,0 4,20 23,10" fill="#E055DB" filter="url(#logo-glow)" />
    <!-- Purple bottom shadow -->
    <polygon points="2,5 2,24 21,14" fill="#5E5496" filter="url(#logo-glow)" />
    <!-- Crisp White Triangle -->
    <polygon points="2,2 2,22 20,12" fill="#FFFFFF" />
  </g>

  <!-- Divider Line -->
  <line x1="66" y1="20" x2="66" y2="44" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round" />

  <!-- Button Text -->
  <text x="142" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">
    DOWNLOAD APK
  </text>

  <!-- Subtle Download Arrow Icon on the right -->
  <path d="M222 25v9m0 0l-3.5-3.5M222 34l3.5-3.5M217 38h10" stroke="#E055DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
