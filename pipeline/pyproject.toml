[project]
name = "fmhy-pipeline"
version = "0.1.0"
description = "Builds the FMHY Android app dataset from fmhy/edit"
requires-python = ">=3.13"
dependencies = [
    "markdown-it-py>=3",
    "zstandard>=0.23",
]

[project.scripts]
fmhy-build = "fmhy_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmhy_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
